{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Trainer - Start Your Journey</title>
    <link rel="stylesheet" href="{% static 'pokemon/background.css' %}">
    <link rel="stylesheet" href="{% static 'pokemon/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hero {
            text-align: center;
            padding: 60px 30px;
            position: relative;
            z-index: 1;
        }
        .logo-container {
            margin-bottom: 30px;
        }
        .pokeball-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(180deg, #ff1a1a 0%, #ff1a1a 45%, #333 45%, #333 55%, #fff 55%, #fff 100%);
            border-radius: 50%;
            box-shadow: 0 15px 40px rgba(255, 0, 0, 0.5),
                        inset 0 -8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        .pokeball-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #fff;
            border: 6px solid #333;
            border-radius: 50%;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff6600 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: none;
        }
        .subtitle {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 50px;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 18px 50px;
            font-size: 1.1rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff6600 100%);
            color: #1a1a2e;
            box-shadow: 0 10px 35px rgba(255, 170, 0, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 45px rgba(255, 170, 0, 0.5);
        }
        .btn-primary:active {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff6600 100%);
            color: #1a1a2e;
            box-shadow: 0 10px 35px rgba(255, 170, 0, 0.4);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-container">
            <div class="pokeball-icon"></div>
        </div>
        <h1>Pocket Trainer</h1>
        <p class="subtitle">Begin your ultimate Pokémon adventure!</p>
        
        <div class="buttons">
            {% if user.is_authenticated %}
                <a href="{% url 'pokemon:dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
                <a href="{% url 'pokemon:logout' %}" class="btn btn-secondary">Logout</a>
            {% else %}
                <a href="{% url 'pokemon:signup' %}" class="btn btn-primary">Start Your Journey</a>
                <a href="{% url 'pokemon:login' %}" class="btn btn-secondary">Login</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
