{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pocket Trainer</title>
    <link rel="stylesheet" href="{% static 'pokemon/background.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            padding: 45px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,200,0,0.03) 0%, transparent 50%);
            animation: subtleGlow 8s ease-in-out infinite;
        }
        @keyframes subtleGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }
        .pokeball-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: linear-gradient(180deg, #ff1a1a 0%, #ff1a1a 45%, #333 45%, #333 55%, #fff 55%, #fff 100%);
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.3),
                        inset 0 -5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        .pokeball-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #fff;
            border: 5px solid #333;
            border-radius: 50%;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff6600 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #8892b0;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccd6f6;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #233554;
            border-radius: 12px;
            background: #0a192f;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: #495670;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
            background: #0d2140;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #ff6600 100%);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(255, 170, 0, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 170, 0, 0.4);
        }
        .btn-primary:active {
            transform: translateY(-1px);
        }
        .links {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #233554;
        }
        .links p {
            margin: 8px 0;
            color: #8892b0;
            font-size: 0.9rem;
        }
        .links a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .links a:hover {
            color: #ffaa00;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .error {
            background: rgba(255, 50, 50, 0.15);
            border: 1px solid rgba(255, 50, 50, 0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #ff6b6b;
            font-size: 0.9rem;
        }
        .decorative-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: radial-gradient(#fff 2px, transparent 2px);
            background-size: 20px 20px;
        }
        .container > *:not(.decorative-dots) {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decorative-dots"></div>
        <div class="logo-container">
            <div class="pokeball-icon"></div>
        </div>
        <h1>Pocket Trainer</h1>
        <p class="subtitle">Begin your Pokémon journey</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <div class="links">
            <p>Don't have an account? <a href="{% url 'pokemon:signup' %}">Sign Up</a></p>
            <p><a href="{% url 'pokemon:home' %}">← Back to Home</a></p>
        </div>
    </div>
</body>
</html>
